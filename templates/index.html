<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>DDCET Question Generator - 31,000 Practice Questions with Solutions | Physics & Maths</title>
    <meta name="title" content="DDCET Question Generator - 31,000 Practice Questions with Solutions">
    <meta name="description" content="Free DDCET question generator with 31,000 practice questions for Physics and Mathematics. Get step-by-step solutions for Diploma to Degree Common Entrance Test preparation.">
    <meta name="keywords" content="DDCET, DDCET questions, DDCET practice, DDCET exam, DDCET preparation, diploma to degree, Gujarat DDCET, physics questions, maths questions, engineering entrance exam, DDCET mock test, DDCET syllabus">
    <meta name="author" content="DDCET Question Generator">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ddcet.onrender.com">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ddcet.onrender.com">
    <meta property="og:title" content="DDCET Question Generator - 31,000 Free Practice Questions">
    <meta property="og:description" content="Free DDCET question generator with 31,000 practice questions. Physics & Mathematics with step-by-step solutions for DDCET exam preparation.">
    <meta property="og:site_name" content="DDCET Question Generator">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ddcet.onrender.com">
    <meta property="twitter:title" content="DDCET Question Generator - Free Practice Questions">
    <meta property="twitter:description" content="31,000 free DDCET practice questions with solutions. Physics & Mathematics for Diploma to Degree entrance exam.">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DDCET Question Generator",
      "url": "https://ddcet.onrender.com",
      "description": "Free online question generator for DDCET (Diploma to Degree Common Entrance Test) with 31,000 practice questions covering Physics and Mathematics with step-by-step solutions.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "keywords": "DDCET, question generator, practice questions, entrance exam, physics, mathematics, Gujarat",
      "inLanguage": "en"
    }
    </script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>DDCET Question Generator</h1>
            <p class="subtitle">31,000+ Practice Questions with Step-by-Step Solutions</p>
            <p class="subtitle">Physics & Mathematics | Diploma to Degree Common Entrance Test (DDCET) Preparation</p>
        </header>

        <form id="question-form">
            <label for="subject">Select Subject:</label>
            <select id="subject" name="subject" required>
                <option value="">-- Choose subject --</option>
                <option value="mathematics">Mathematics</option>
                <option value="physics">Physics</option>
            </select>

            <label for="topic">Select Topic:</label>
            <select id="topic" name="topic" required disabled>
                <option value="">-- Select subject first --</option>
            </select>

            <label for="count">Number of Questions (1-100):</label>
            <input type="number" id="count" name="count" min="1" max="100" value="10">

            <button type="submit">Generate Questions</button>
            <button type="button" class="danger" onclick="clearQuestions()">Clear All</button>
        </form>

        <div id="loading" style="display: none;">
            Loading questions...
        </div>

        <div id="results" style="display: none;">
            <h2>Questions</h2>
            <div style="margin-bottom: 15px;">
                <button onclick="exportQuestions('json')">Export JSON</button>
                <button onclick="exportQuestions('text')">Export TXT</button>
            </div>
            <div id="questions-list"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
