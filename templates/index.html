<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Question Generator</h1>
            <p class="subtitle">DDCET Physics & Mathematics</p>
            <div class="stats">Session: <span id="sessionCount">0</span> questions</div>
        </header>

        <main>
            <form id="generateForm">
                <label>Subject:</label>
                <select id="subject" required>
                    <option value="">--Select--</option>
                    <option value="Physics">Physics</option>
                    <option value="Mathematics">Mathematics</option>
                </select>

                <label>Topic:</label>
                <select id="topic" disabled required>
                    <option value="">--Select subject first--</option>
                </select>

                <label>Difficulty:</label>
                <select id="difficulty" required>
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <label>Count:</label>
                <input type="number" id="count" min="1" max="50" value="10" required>

                <label>Type (Math only):</label>
                <select id="questionType">
                    <option value="all">All</option>
                    <option value="basic">Basic</option>
                    <option value="trig">Trig</option>
                    <option value="advanced">Advanced</option>
                </select>

                <button type="submit">Generate</button>
            </form>

            <div id="loading" style="display:none;">Generating...</div>

            <div id="results" style="display:none;">
                <h2>Generated Questions</h2>
                <div id="questionsList"></div>
            </div>

            <div id="statistics" style="display:none;">
                <h2>Statistics</h2>
                <div id="statsContent"></div>
            </div>

            <div id="actions" style="display:none;">
                <button onclick="viewAllQuestions()">View All</button>
                <button onclick="showStatistics()">Stats</button>
                <button onclick="exportQuestions('json')">JSON</button>
                <button onclick="exportQuestions('csv')">CSV</button>
                <button onclick="exportQuestions('txt')">TXT</button>
                <button onclick="clearQuestions()" class="danger">Clear</button>
            </div>
        </main>

        <footer>
            <p>130+ Formulas | 20 Generators | <a href="https://github.com/Het-Sathwara/DDCET-Practice-Question-Generator">GitHub</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
