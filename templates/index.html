<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDCET Question Generator - 27,000 Questions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 DDCET Question Generator</h1>
            <p class="subtitle">27,000 Questions with Step-by-Step Solutions | JEE & GUJCET Patterns</p>
            <div class="stats">
                Total Available: <span>{{ total_questions }}</span> questions | 
                Session Generated: <span id="session-count">0</span>
            </div>
        </header>

        <form id="question-form">
            <label for="topic">📖 Select Chapter/Topic:</label>
            <select id="topic" name="topic" required>
                <option value="">-- Choose a topic --</option>
                {% for key, name in topics.items() %}
                <option value="{{ key }}">{{ name }}</option>
                {% endfor %}
            </select>

            <label for="count">🔢 Number of Questions (1-100):</label>
            <input type="number" id="count" name="count" min="1" max="100" value="10">

            <button type="submit">🎯 Generate Questions</button>
            <button type="button" class="danger" onclick="clearQuestions()">🗑️ Clear All</button>
        </form>

        <div id="loading" style="display: none;">
            ⏳ Loading questions...
        </div>

        <div id="results" style="display: none;">
            <h2>Generated Questions</h2>
            <div style="margin-bottom: 15px;">
                <button onclick="exportQuestions('json')">📥 Export JSON</button>
                <button onclick="exportQuestions('text')">📄 Export TXT</button>
            </div>
            <div id="questions-list"></div>
        </div>

        <div id="statistics" style="display: none;">
            <h2>📊 Statistics</h2>
            <div id="stats-content"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
