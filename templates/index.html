<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Generator - DDCET</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Question Generator</h1>
            <p class="subtitle">Physics & Mathematics Question Generation System</p>
            <div class="stats-bar" id="statsBar">
                <span>Questions in Session: <strong id="sessionCount">0</strong></span>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Generation Form -->
            <section class="card">
                <h2>Generate Questions</h2>
                <form id="generateForm">
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" required>
                            <option value="">Select Subject</option>
                            <option value="Physics">Physics</option>
                            <option value="Mathematics">Mathematics</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <select id="topic" name="topic" required disabled>
                            <option value="">Select topic first</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="difficulty">Difficulty</label>
                        <select id="difficulty" name="difficulty" required>
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="count">Number of Questions</label>
                        <input type="number" id="count" name="count" min="1" max="100" value="10" required>
                    </div>

                    <div class="form-group">
                        <label for="questionType">Question Type (Math only)</label>
                        <select id="questionType" name="questionType">
                            <option value="all">All Types</option>
                            <option value="basic">Basic</option>
                            <option value="trig">Trigonometric</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Generate Questions</button>
                </form>
            </section>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Generating questions...</p>
            </div>

            <!-- Results Section -->
            <section id="results" class="card" style="display: none;">
                <h2>Generated Questions</h2>
                <div id="questionsList"></div>
            </section>

            <!-- Statistics Section -->
            <section id="statistics" class="card" style="display: none;">
                <h2>Statistics</h2>
                <div id="statsContent"></div>
            </section>

            <!-- Action Buttons -->
            <section id="actions" class="actions" style="display: none;">
                <button onclick="viewAllQuestions()" class="btn btn-secondary">View All Questions</button>
                <button onclick="showStatistics()" class="btn btn-secondary">View Statistics</button>
                <button onclick="exportQuestions('json')" class="btn btn-success">Export JSON</button>
                <button onclick="exportQuestions('csv')" class="btn btn-success">Export CSV</button>
                <button onclick="exportQuestions('txt')" class="btn btn-success">Export TXT</button>
                <button onclick="clearQuestions()" class="btn btn-danger">Clear All</button>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>Status: PRODUCTION READY | 130+ Formulas | 20 Generators</p>
            <p>Made for DDCET aspirants | <a href="https://github.com/Het-Sathwara/DDCET-Practice-Question-Generator" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
